name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Django checks
        run: python manage.py check
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
          DJANGO_DEBUG: "1"

      - name: Migrations are consistent with the models
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-used-outside-ci
          DJANGO_DEBUG: "1"

      # The settings module had no production form at all: DEBUG was hardcoded
      # on, the secret key had a published fallback, and every cookie and
      # transport setting was absent. This fails the build if that returns.
      - name: Deployment checks
        run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_SECRET_KEY: a-sufficiently-long-ci-secret-key-for-the-deploy-check-000
          DJANGO_ALLOWED_HOSTS: example.com

      - name: Test
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
