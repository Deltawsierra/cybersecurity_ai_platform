<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard - Audit Logs</title>
</head>
<body>
    <h1>Audit Log Dashboard</h1>
    <table border="1">
        <thead>
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
            <tr>
                <td>{{ log.user }}</td>
                <td>{{ log.action }}</td>
                <td>{{ log.timestamp }}</td>
            </tr>
            {% empty %}
            <tr><td colspan="3">No logs yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</body>
</html>
